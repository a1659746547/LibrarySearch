[package]
name = "easyeda2altium"
version = "0.1.0"
default-run = "easyeda2altium"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
cfb = "0.10.0"
altium = { path = "../dependencies/altiumrs-2b45c1f91278680255d1f8dac067b95e0917f143/crates/altium" }
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "gzip", "json"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8.35"
thiserror = "2"
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

[[bin]]
name = "easyeda2altium"
path = "src/main.rs"

[lib]
name = "easyeda2altium"
path = "src/lib.rs"
